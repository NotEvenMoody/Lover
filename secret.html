<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secret</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Lato:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="secret-body">
  <div id="save-indicator" class="save-indicator" aria-live="polite"></div>

  <main class="page-content secret-page">
    <div class="secret-card">
      <img src="lock.gif" alt="" class="lock-icon" width="250" height="250" />
      <form id="secret-form" class="secret-form" autocomplete="off">
        <div class="secret-input-wrap">
          <input
            type="text"
            id="secret-password"
            class="secret-input secret-input-masked"
            placeholder="Enter the secret..."
            aria-label="Password"
            autocomplete="off"
          />
          <button
            type="button"
            id="toggle-password"
            class="secret-toggle-password"
            aria-label="Show password"
            aria-pressed="false"
          >👁️</button>
        </div>
        <p class="secret-hint">only you know this...</p>
        <p id="secret-error" class="secret-error" role="alert"></p>
        <button type="submit" class="btn btn-filled secret-submit">Unlock</button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/hearts.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/secret.js"></script>
</body>
</html>

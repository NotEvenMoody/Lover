<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love me?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Lato:wght@300;400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

<body class="love-body">

    <svg class="heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

    <div class="love-buttons">
      <button type="button" id="btn-yes" class="btn btn-filled">Yes</button>
      <button type="button" id="btn-no" class="btn btn-outlined">No</button>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/hearts.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/back-nav.js"></script>

</html>
